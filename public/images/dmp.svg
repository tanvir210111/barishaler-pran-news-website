<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="dmpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#dmpBg)"/>
  
  <!-- Outer Shield Crest -->
  <path d="M160 25 C210 25, 235 45, 235 105 C235 145, 195 170, 160 180 C125 170, 85 145, 85 105 C85 45, 110 25, 160 25 Z" fill="#008080" stroke="#ffd700" stroke-width="3"/>
  
  <!-- Inner Red Ribbon / Arch -->
  <circle cx="160" cy="95" r="45" fill="#facc15" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Red 5-Point Star -->
  <polygon points="160,65 169,86 192,86 174,99 181,121 160,107 139,121 146,99 128,86 151,86" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  
  <!-- Red Ribbon at bottom with text -->
  <path d="M100 135 Q160 165 220 135 L225 148 Q160 180 95 148 Z" fill="#dc2626"/>
  <text x="160" y="153" fill="#ffffff" font-family="'Noto Sans Bengali', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">শান্তি শৃঙ্খলা প্রগতি</text>
  
  <!-- DMP Bengali Header -->
  <text x="160" y="18" fill="#1e3a8a" font-family="'Noto Sans Bengali', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">ঢাকা মেট্রোপলিটন পুলিশ</text>
</svg>
